version: "3.9"

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: shortlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shortlink
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shortlink-net

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: shortlink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shortlink-net

  # ==================== Spring Boot 短链接服务 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortlink-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: shortlink
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shortlink-net

volumes:
  mysql-data:
  redis-data:

networks:
  shortlink-net:
    driver: bridge
